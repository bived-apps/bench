name: bive-authorize-merge

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Ready pull request number (not a URL)"
        required: true
        type: string
      head_sha:
        description: "Full 40-character head SHA reviewed by the coordinator"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: owner-merge-authorization-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never execute the requested PR's code with this workflow's write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authorize this head through today UTC and rerun its gate
        env:
          GH_TOKEN: ${{ github.token }}
          BIVE_PR_NUMBER: ${{ inputs.pull_request }}
          BIVE_HEAD_SHA: ${{ inputs.head_sha }}
          BIVE_MERGE_OWNER: ${{ vars.BIVE_MERGE_OWNER }}
          BIVE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node .github/scripts/authorize-merge.mjs
